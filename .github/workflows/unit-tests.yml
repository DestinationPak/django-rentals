name: Unit Tests

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        django-version: ["4.2", "5.2"]

    name: python-${{ matrix.python-version }}-django-${{ matrix.django-version }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: pip install -r requirements.txt -r requirements-dev.txt

    - name: Install Django ${{ matrix.django-version }}
      # Pinned separately from requirements.txt (which tracks one concrete
      # version for local/docker dev) so this job actually exercises the
      # Django range setup.cfg's install_requires claims to support.
      run: pip install "Django~=${{ matrix.django-version }}.0"

    - name: Show resolved versions
      run: |
        python --version
        python -c "import django; print('Django', django.get_version())"
        python -c "import rest_framework; print('djangorestframework', rest_framework.VERSION)"

    - name: run tests
      run: pytest

